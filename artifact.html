<title>Einkaufshelfer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style id="app-style">
/* Layout: Geldbeutel fest oben, darunter ein großer Scan-Knopf, das Scan-Ergebnis und der Korb; Betreuer-Bereich ganz unten */
:root {
  --bg: #eaf1f4; --card: #ffffff; --ink: #14303c; --muted: #4f6b78; --line: #c9d9e1;
  --accent: #1d6a86; --accent-ink: #ffffff;
  --ok: #24914f; --warn: #d97f00; --stop: #cc3333; --soft: #dde9ee;
  --a-gruen: #1f9d4c; --a-gelb: #e9b200; --a-rot: #d93a2b; --a-aus: #c4d2d9;
  --font: "Atkinson Hyperlegible", Verdana, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1b21; --card: #172a33; --ink: #e6f0f4; --muted: #9bb3bf; --line: #2b434e;
  --accent: #5db2d1; --accent-ink: #0e1b21;
  --ok: #3cbf72; --warn: #f2a427; --stop: #ef5c5c; --soft: #1f3640;
  --a-gruen: #35c46a; --a-gelb: #f5c518; --a-rot: #f05545; --a-aus: #2f4752; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1b21; --card: #172a33; --ink: #e6f0f4; --muted: #9bb3bf; --line: #2b434e;
  --accent: #5db2d1; --accent-ink: #0e1b21;
  --ok: #3cbf72; --warn: #f2a427; --stop: #ef5c5c; --soft: #1f3640;
  --a-gruen: #35c46a; --a-gelb: #f5c518; --a-rot: #f05545; --a-aus: #2f4752; color-scheme: dark }

body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 18px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 32px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
#app { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

.kopf { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 12px;
  display: flex; flex-direction: column; gap: 8px; border-bottom: 2px solid var(--line); }
.balken-rahmen { height: 54px; border-radius: 27px; background: var(--soft); border: 3px solid var(--ink); overflow: hidden; }
.balken { height: 100%; background: var(--ok); border-radius: 24px; transition: width .4s ease, background-color .4s; }
.stufe-warn .balken { background: var(--warn); }
.stufe-stop .balken-rahmen { border-color: var(--stop); }
.stufe-stop .balken { background: var(--stop); }
.meldung { margin: 0; font-size: 26px; font-weight: 700; text-align: center; text-wrap: balance; color: var(--ok); }
.stufe-warn .meldung { color: var(--warn); }
.stufe-stop .meldung { color: var(--stop); }
.betrag { margin: 0; text-align: center; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }

.scan-knopf { display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; border-radius: 24px; padding: 26px 16px;
  background: var(--accent); color: var(--accent-ink); font-size: 28px; font-weight: 700; box-shadow: 0 6px 0 color-mix(in srgb, var(--accent) 60%, var(--ink)); }
.scan-knopf:active { transform: translateY(4px); box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 60%, var(--ink)); }
.scan-knopf .gross { font-size: 64px; line-height: 1; }
.scan-knopf .klein-text { font-size: 16px; font-weight: 400; opacity: .9; }
.scan-knopf[disabled] { opacity: .5; }

.ergebnis { background: var(--card); border: 4px solid var(--line); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.ergebnis.ok { border-color: var(--ok); }
.ergebnis.stop { border-color: var(--stop); }
.ergebnis.warn { border-color: var(--warn); }
.ergebnis .bild { height: 150px; display: grid; place-items: center; font-size: 110px; line-height: 1; }
.ergebnis .bild img { max-height: 150px; width: auto; border-radius: 10px; }
.ergebnis .name { margin: 0; font-size: 30px; font-weight: 700; }
.ergebnis .satz { margin: 0; font-size: 22px; font-weight: 700; text-wrap: balance; }
.ergebnis.ok .satz { color: var(--ok); }
.ergebnis.stop .satz { color: var(--stop); }
.ergebnis.warn .satz { color: var(--warn); }
.knopf-paar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }

.block { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.block h2 { margin: 0; font-size: 22px; }
.liste { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.liste li { display: flex; align-items: center; gap: 10px; }
.k-bild { width: 44px; height: 44px; display: grid; place-items: center; font-size: 32px; flex: none; }
.k-bild img { max-height: 44px; border-radius: 6px; }
.k-name { flex: 1; min-width: 0; font-weight: 700; }
.k-info { font-size: 14px; color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.leer { margin: 0; color: var(--muted); }
.zeile-knopf { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 2px solid var(--line); background: var(--bg); border-radius: 12px; padding: 6px 10px; }
.marke { flex: none; font-size: 13px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
.marke.ja { background: color-mix(in srgb, var(--ok) 20%, var(--card)); color: var(--ok); }
.marke.nein { background: color-mix(in srgb, var(--warn) 20%, var(--card)); color: var(--warn); }

.knopf { border: 0; border-radius: 14px; padding: 16px 18px; font-size: 20px; font-weight: 700; background: var(--accent); color: var(--accent-ink); }
.knopf.gruen { background: var(--ok); color: #ffffff; }
.knopf.hell { background: var(--soft); color: var(--ink); }
.knopf.rot { background: var(--stop); color: #ffffff; }
.knopf.klein { padding: 8px 12px; font-size: 16px; }
.reihe { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.frage { margin: 0; font-weight: 700; }

.betreuer-start { align-self: center; border: 2px dashed var(--line); background: none; border-radius: 12px; padding: 8px 14px; font-size: 15px; color: var(--muted); }
.betreuer { border-color: var(--warn); border-style: dashed; }
.feld { display: flex; flex-direction: column; gap: 4px; font-size: 16px; font-weight: 700; }
.feld input, .feld select { border: 2px solid var(--line); border-radius: 10px; padding: 10px; background: var(--bg); font-weight: 400; min-width: 0; }
.felder { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.foto-vorschau { max-height: 100px; border-radius: 8px; }
.status { margin: 0; font-size: 16px; color: var(--muted); }
.status.wichtig { color: var(--warn); font-weight: 700; }
.hinweis-klein { margin: 0; font-size: 14px; color: var(--muted); }
.schnell-knopf { padding: 18px 16px; font-size: 22px; box-shadow: none; }
.schnell-knopf .gross { font-size: 40px; }
.schnell { border: 3px solid var(--accent); }
.schnell .code { margin: 0; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.schnell .bekannt { margin: 0; font-weight: 700; color: var(--ok); }
.zaehler { margin: 0; font-weight: 700; color: var(--ok); }
.banner { background: color-mix(in srgb, var(--warn) 15%, var(--card)); border: 2px solid var(--warn); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.ampel { display: flex; align-items: center; gap: 12px; background: var(--soft); border-radius: 999px; padding: 8px 18px 8px 10px; }
.ampel .lichter { display: flex; gap: 6px; background: #1d2a30; border-radius: 999px; padding: 6px; }
.ampel .licht { width: 26px; height: 26px; border-radius: 50%; background: var(--a-aus); opacity: .45; }
.ampel .licht.an { opacity: 1; box-shadow: 0 0 10px currentColor; }
.ampel .licht.gruen.an { background: var(--a-gruen); color: var(--a-gruen); }
.ampel .licht.gelb.an { background: var(--a-gelb); color: var(--a-gelb); }
.ampel .licht.rot.an { background: var(--a-rot); color: var(--a-rot); }
.ampel .wort { font-size: 22px; font-weight: 700; }
.punkt { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: middle; margin-right: 6px; background: var(--a-aus); }
.punkt.gruen { background: var(--a-gruen); } .punkt.gelb { background: var(--a-gelb); } .punkt.rot { background: var(--a-rot); }
.korb-ampel { margin: 0; font-size: 17px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.suche { border: 2px solid var(--line); border-radius: 10px; padding: 10px; background: var(--bg); width: 100%; box-sizing: border-box; }
@media (prefers-reduced-motion: reduce) { .balken { transition: none; } .scan-knopf:active { transform: none; } }
</style>

<script id="app-script">
(function () {
  var state = JSON.parse(document.getElementById('daten').textContent);
  var KORB_KEY = 'einkaufsgeld-korb-v2';
  var korb = ladeKorb();
  var ergebnis = null;      // {typ: 'ok'|'zuteuer'|'unbekannt'|'nichts'|'sucht', id}
  var betreuer = false, frageBetreuer = false, frageNeu = false;
  var bearbeite = null, entwurf = {}, entwurfFoto = null, ungespeichert = false, statusText = '', suche = '';
  var scanZiel = 'kunde';
  var schnell = null, schnellZaehler = 0, letzteKat = null;
  var ENTWURF_KEY = 'einkaufsgeld-entwurf-v1';
  var gesichert = ladeGesichert();
  var KAT_EMOJI = { frueh: '🍞', essen: '🍽️', obst: '🥕', trinken: '🥤', suess: '🍬' };
  function ladeGesichert() { try { var t = localStorage.getItem(ENTWURF_KEY); if (!t) return null; var g = JSON.parse(t); return g && g.produkte ? g : null; } catch (e) { return null; } }
  function sichereEntwurf() { try { localStorage.setItem(ENTWURF_KEY, JSON.stringify(state)); } catch (e) {} }
  function loescheEntwurf() { try { localStorage.removeItem(ENTWURF_KEY); } catch (e) {} gesichert = null; }
  var app = document.getElementById('app');
  var scanInput = document.getElementById('scan-input');
  var fotoInput = document.getElementById('foto-input');

  function ladeKorb() { try { return JSON.parse(localStorage.getItem(KORB_KEY) || '{}') || {}; } catch (e) { return {}; } }
  function speichereKorb() { try { localStorage.setItem(KORB_KEY, JSON.stringify(korb)); } catch (e) {} }
  function cent(x) { return Math.round(Number(x) * 100); }
  function euro(c) { c = Math.max(0, c); return Math.floor(c / 100) + ',' + String(c % 100).padStart(2, '0') + ' €'; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]; }); }
  function norm(code) { var d = String(code || '').replace(/\D/g, ''); return d.length === 12 ? '0' + d : d; }
  function produkt(id) { return state.produkte.find(function (p) { return p.id === id; }) || null; }
  function produktZuCode(code) { var n = norm(code); if (!n) return null; return state.produkte.find(function (p) { return p.ean && norm(p.ean) === n; }) || null; }
  function summe() { var s = 0; state.produkte.forEach(function (p) { s += (korb[p.id] || 0) * cent(p.preis); }); return s; }
  function rest() { return cent(state.budget) - summe(); }
  function billigst() { var l = state.produkte.filter(function (p) { return p.ean; }); if (!l.length) l = state.produkte; if (!l.length) return 1; return Math.min.apply(null, l.map(function (p) { return cent(p.preis); })); }
  function sprich(t) { try { if (!('speechSynthesis' in window)) return; var u = new SpeechSynthesisUtterance(t); u.lang = 'de-DE'; u.rate = 0.9; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {} }
  var AMPEL = {
    gruen: { wort: 'Gesund', satz: 'Gesund. Davon darfst du viel essen.' },
    gelb: { wort: 'Ab und zu', satz: 'Das ist okay, aber nur ab und zu.' },
    rot: { wort: 'Nur selten', satz: 'Nicht so gesund. Nur selten essen.' }
  };
  function ampelHtml(p) {
    var a = AMPEL[p.ampel]; if (!a) return '';
    return '<div class="ampel" data-sprich="' + esc(a.satz) + '" role="img" aria-label="Ampel: ' + esc(a.wort) + '"><span class="lichter" aria-hidden="true">' +
      ['rot', 'gelb', 'gruen'].map(function (f) { return '<span class="licht ' + f + (p.ampel === f ? ' an' : '') + '"></span>'; }).join('') +
      '</span><span class="wort">' + esc(a.wort) + '</span></div>';
  }
  function ampelSatz(p) { var a = AMPEL[p.ampel]; return a ? ' ' + a.satz : ''; }
  function punkt(p) { return '<span class="punkt ' + esc(p.ampel || '') + '" aria-hidden="true"></span>'; }
  function ampelOptionen(wert) {
    return [['gruen', 'Grün – gesund (Nutri-Score A/B)'], ['gelb', 'Gelb – ab und zu (C)'], ['rot', 'Rot – nur selten (D/E)'], ['', 'Weiß ich nicht']]
      .map(function (o) { return '<option value="' + o[0] + '"' + ((wert || '') === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('');
  }
  function bildHtml(p) { return p.foto ? '<img src="' + esc(p.foto) + '" alt="">' : '<span aria-hidden="true">' + esc(p.emoji || '🛒') + '</span>'; }

  /* ---------- Barcode aus einem Foto lesen ---------- */
  function bildZuCanvas(datei, max) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(datei), img = new Image();
      img.onload = function () {
        var f = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement('canvas'); c.width = Math.round(img.width * f); c.height = Math.round(img.height * f);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c);
      };
      img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('bild')); };
      img.src = url;
    });
  }
  function drehen(c) {
    var d = document.createElement('canvas'); d.width = c.height; d.height = c.width;
    var x = d.getContext('2d'); x.translate(d.width / 2, d.height / 2); x.rotate(Math.PI / 2); x.drawImage(c, -c.width / 2, -c.height / 2); return d;
  }
  async function barcodeLesen(datei) {
    var c = await bildZuCanvas(datei, 1400);
    if ('BarcodeDetector' in window) {
      try { var det = new window.BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e'] }); var r = await det.detect(c); if (r && r.length) return r[0].rawValue; } catch (e) {}
    }
    if (window.ZXing) {
      var Z = window.ZXing, hints = new Map();
      hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E]);
      hints.set(Z.DecodeHintType.TRY_HARDER, true);
      var reader = new Z.MultiFormatReader(); reader.setHints(hints);
      var versuche = [c, drehen(c)];
      for (var i = 0; i < versuche.length; i++) {
        try { var src = new Z.HTMLCanvasElementLuminanceSource(versuche[i]); return reader.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(src))).getText(); } catch (e) {}
      }
    }
    return null;
  }

  function scanStarten(ziel) { scanZiel = ziel; scanInput.value = ''; scanInput.click(); }

  async function scanVerarbeiten(datei) {
    if (scanZiel === 'kunde') { ergebnis = { typ: 'sucht' }; render(); }
    else if (scanZiel === 'schnell') { schnell = { phase: 'liest' }; render(); }
    else { statusText = 'Lese den Barcode …'; render(); }
    var code = null;
    try { code = await barcodeLesen(datei); } catch (e) { code = null; }

    if (scanZiel === 'schnell') {
      if (!code) { schnell = { phase: 'fehler' }; render(); return; }
      var bek = produktZuCode(code);
      schnell = { phase: 'form', ean: norm(code), id: bek ? bek.id : null };
      render();
      var ziel = document.getElementById(bek ? 's-preis' : 's-name'); if (ziel) { ziel.focus(); if (bek) try { ziel.select(); } catch (x) {} }
      return;
    }
    if (scanZiel === 'formular') {
      if (code) { entwurf.ean = norm(code); statusText = 'Barcode erkannt: ' + norm(code); }
      else statusText = 'Kein Barcode gefunden. Bitte näher ran und noch einmal, oder die Zahlen unter dem Strichcode abtippen.';
      render(); return;
    }
    if (scanZiel === 'betreuer') {
      if (!code) { statusText = 'Kein Barcode gefunden. Bitte noch einmal versuchen.'; render(); return; }
      var vorhanden = produktZuCode(code);
      if (vorhanden) { bearbeite = vorhanden.id; entwurf = {}; statusText = vorhanden.name + ' hat diesen Barcode schon.'; }
      else { bearbeite = 'neu'; entwurf = { ean: norm(code) }; statusText = 'Neuer Barcode ' + norm(code) + '. Trag Name und Preis ein, oder tippe unten ein vorhandenes Produkt an und scanne dort.'; }
      entwurfFoto = null; render(); window.scrollTo(0, 0); return;
    }

    // Kunde
    if (!code) { ergebnis = { typ: 'nichts' }; sprich('Ich konnte keinen Strichcode finden. Halte das Handy ganz nah an den Strichcode und versuch es noch einmal.'); render(); return; }
    var p = produktZuCode(code);
    if (!p) { ergebnis = { typ: 'unbekannt' }; sprich('Das kenne ich nicht. Frag deinen Betreuer.'); render(); return; }
    if (cent(p.preis) > rest()) { ergebnis = { typ: 'zuteuer', id: p.id }; sprich(p.name + '.' + ampelSatz(p) + ' Aber dafür reicht dein Geld nicht mehr. Leg es zurück ins Regal.'); render(); return; }
    ergebnis = { typ: 'ok', id: p.id }; sprich(p.name + '.' + ampelSatz(p) + ' Das passt in dein Geld.'); render();
  }

  /* ---------- Anzeige ---------- */
  function render() {
    var r = rest(), b = cent(state.budget) || 1;
    var anteil = Math.max(0, Math.min(1, r / b));
    var stufe, text, icon;
    if (r < billigst()) { stufe = 'stop'; text = 'Dein Geld ist alle. Geh jetzt zur Kasse.'; icon = '🛑'; }
    else if (anteil < 0.25) { stufe = 'warn'; text = 'Nur noch wenig Geld.'; icon = '⚠️'; }
    else { stufe = 'ok'; text = 'Du hast noch Geld.'; icon = '😊'; }

    var h = '<header class="kopf stufe-' + stufe + '">';
    h += '<div class="balken-rahmen" role="meter" aria-label="Übriges Geld" aria-valuemin="0" aria-valuemax="' + b + '" aria-valuenow="' + Math.max(0, r) + '"><div class="balken" style="width:' + (anteil * 100).toFixed(1) + '%"></div></div>';
    h += '<p class="meldung" aria-live="polite">' + icon + ' ' + esc(text) + '</p>';
    h += '<p class="betrag">Noch ' + euro(r) + ' von ' + euro(cent(state.budget)) + '</p></header>';

    if (betreuer) {
      h += betreuerHtml();
    } else {
      var leer = r < billigst();
      h += '<button class="scan-knopf" data-sprich="Scannen" data-act="scannen"' + (leer ? ' disabled' : '') + '><span class="gross" aria-hidden="true">📷</span>Scannen<span class="klein-text">Fotografiere den Strichcode</span></button>';
      if (ergebnis) h += ergebnisHtml();
      h += korbHtml();
      if (frageBetreuer) h += '<section class="block betreuer"><p class="frage">Betreuer-Bereich öffnen?</p><div class="reihe"><button class="knopf" data-act="betreuer-ja">Ja</button><button class="knopf hell" data-act="betreuer-nein">Nein</button></div></section>';
      else h += '<button class="betreuer-start" data-act="betreuer-frage">⚙️ Betreuer</button>';
    }
    if (ungespeichert) sichereEntwurf();
    var aktiv = document.activeElement && document.activeElement.id;
    app.innerHTML = h;
    if (aktiv && document.getElementById(aktiv)) document.getElementById(aktiv).focus();
  }

  function ergebnisHtml() {
    var e = ergebnis, p = e.id ? produkt(e.id) : null;
    if (e.typ === 'sucht') return '<section class="ergebnis" aria-live="polite"><div class="bild" aria-hidden="true">🔎</div><p class="satz">Ich schaue nach …</p></section>';
    if (e.typ === 'nichts') return '<section class="ergebnis warn" aria-live="polite"><div class="bild" aria-hidden="true">🤔</div><p class="satz">Ich konnte keinen Strichcode finden. Halte das Handy ganz nah dran.</p><button class="knopf" data-act="scannen">📷 Noch einmal</button></section>';
    if (e.typ === 'unbekannt') return '<section class="ergebnis warn" aria-live="polite"><div class="bild" aria-hidden="true">❓</div><p class="satz">Das kenne ich nicht. Frag deinen Betreuer.</p><button class="knopf hell" data-act="ergebnis-weg">OK</button></section>';
    if (!p) return '';
    if (e.typ === 'zuteuer') return '<section class="ergebnis stop" aria-live="polite"><div class="bild" data-sprich="' + esc(p.name) + '">' + bildHtml(p) + '</div><p class="name" data-sprich="' + esc(p.name) + '">' + esc(p.name) + '</p>' + ampelHtml(p) + '<p class="satz">🛑 Dafür reicht dein Geld nicht mehr. Leg es zurück ins Regal.</p><button class="knopf hell" data-act="ergebnis-weg">OK</button></section>';
    return '<section class="ergebnis ok" aria-live="polite"><div class="bild" data-sprich="' + esc(p.name) + '">' + bildHtml(p) + '</div><p class="name" data-sprich="' + esc(p.name) + '">' + esc(p.name) + '</p>' + ampelHtml(p) + '<p class="satz">✅ Das passt in dein Geld.</p>' +
      '<div class="knopf-paar"><button class="knopf gruen" data-sprich="In den Korb" data-act="in-korb" data-id="' + esc(p.id) + '">🧺 In den Korb</button><button class="knopf hell" data-sprich="Zurück ins Regal" data-act="ergebnis-weg">✖ Zurück ins Regal</button></div></section>';
  }

  function korbHtml() {
    var h = '<section class="block" aria-label="Mein Korb"><h2>🧺 Mein Korb</h2>';
    var imKorb = state.produkte.filter(function (p) { return korb[p.id]; });
    if (!imKorb.length) h += '<p class="leer">Noch nichts im Korb.</p>';
    else {
      h += '<ul class="liste">';
      imKorb.forEach(function (p) {
        h += '<li data-sprich="' + esc(p.name) + '"><span class="k-bild">' + bildHtml(p) + '</span><span class="k-name">' + punkt(p) + esc(p.name) + ' × ' + korb[p.id] + '</span><button class="knopf hell klein" data-sprich="' + esc(p.name) + ' zurücklegen" data-act="weg" data-id="' + esc(p.id) + '" aria-label="' + esc(p.name) + ' zurücklegen">➖</button></li>';
      });
      h += '</ul>';
      var z = { gruen: 0, gelb: 0, rot: 0 };
      imKorb.forEach(function (p) { if (z[p.ampel] != null) z[p.ampel] += korb[p.id]; });
      h += '<p class="korb-ampel" data-sprich="In deinem Korb: ' + z.gruen + ' gesund, ' + z.gelb + ' ab und zu, ' + z.rot + ' nur selten."><span><span class="punkt gruen"></span>' + z.gruen + ' gesund</span><span><span class="punkt gelb"></span>' + z.gelb + ' ab und zu</span><span><span class="punkt rot"></span>' + z.rot + ' nur selten</span></p>';
    }
    if (frageNeu) h += '<p class="frage">Alles aus dem Korb nehmen und neu anfangen?</p><div class="reihe"><button class="knopf rot" data-act="neu-ja">Ja, neu anfangen</button><button class="knopf hell" data-act="neu-nein">Nein</button></div>';
    else h += '<div class="reihe"><button class="knopf hell klein" data-act="neu-frage">🔄 Neue Woche</button></div>';
    return h + '</section>';
  }

  function betreuerHtml() {
    var mitCode = state.produkte.filter(function (p) { return p.ean; }).length;
    var h = '<section class="block betreuer" aria-label="Betreuer-Bereich"><h2>⚙️ Betreuer-Bereich</h2>';
    h += '<p class="hinweis-klein">' + mitCode + ' von ' + state.produkte.length + ' Produkten haben einen Barcode. Nur diese erkennt die App beim Scannen. Am einfachsten scannst du die Produkte einmal im Laden ein. Preise sind geschätzt (Stand Oktober 2026), Getränke inklusive Pfand.</p>';
    if (gesichert && !ungespeichert) h += '<div class="banner"><p class="frage">Es gibt ungespeicherte Änderungen von vorhin (' + gesichert.produkte.filter(function (p) { return p.ean; }).length + ' Produkte mit Barcode).</p><div class="reihe"><button class="knopf klein" data-act="entwurf-holen">Wiederherstellen</button><button class="knopf hell klein" data-act="entwurf-weg">Verwerfen</button></div></div>';
    h += schnellHtml();
    h += '<div class="felder"><label class="feld" for="f-budget">Wochenbudget in €<input id="f-budget" type="number" min="1" step="0.5" inputmode="decimal" value="' + esc(state.budget) + '"></label></div>';
    h += '<div class="reihe"><button class="knopf hell" data-act="betreuer-scan">📷 Einzeln scannen</button><button class="knopf hell" data-act="neu-produkt">➕ Neues Produkt</button></div>';
    if (statusText) h += '<p class="status" aria-live="polite">' + esc(statusText) + '</p>';
    if (bearbeite) h += formularHtml();
    h += '<div class="reihe"><button class="knopf' + (ungespeichert ? '' : ' hell') + '" data-act="speichern">💾 Speichern</button><button class="knopf hell" data-act="fertig">✅ Fertig</button></div>';
    if (ungespeichert) h += '<p class="status wichtig">Es gibt ungespeicherte Änderungen.</p>';
    h += '</section>';

    h += '<section class="block" aria-label="Alle Produkte"><h2>Alle Produkte</h2>';
    h += '<input id="f-suche" class="suche" type="search" placeholder="Produkt suchen" value="' + esc(suche) + '">';
    h += '<ul class="liste">';
    var s = suche.trim().toLowerCase();
    state.produkte.filter(function (p) { return !s || p.name.toLowerCase().indexOf(s) >= 0; }).forEach(function (p) {
      h += '<li><button class="zeile-knopf" data-sprich="' + esc(p.name) + '" data-act="bearbeiten" data-id="' + esc(p.id) + '"><span class="k-bild">' + bildHtml(p) + '</span><span class="k-name">' + punkt(p) + esc(p.name) + '<br><span class="k-info">' + euro(cent(p.preis)) + '</span></span>' +
        '<span class="marke ' + (p.ean ? 'ja">Barcode ✓' : 'nein">kein Barcode') + '</span></button></li>';
    });
    h += '</ul></section>';
    return h;
  }

  function schnellHtml() {
    var h = '';
    if (schnellZaehler) h += '<p class="zaehler">✓ Heute ' + schnellZaehler + ' Produkt' + (schnellZaehler === 1 ? '' : 'e') + ' erfasst. Speichern nicht vergessen.</p>';
    if (!schnell) return h + '<button class="scan-knopf schnell-knopf" data-act="schnell-scan"><span class="gross" aria-hidden="true">⚡</span>Schnell einscannen<span class="klein-text">Scannen, Preis eintragen, nächstes Produkt</span></button>';
    if (schnell.phase === 'liest') return h + '<div class="block schnell"><p class="frage">🔎 Lese den Barcode …</p></div>';
    if (schnell.phase === 'fehler') return h + '<div class="block schnell"><p class="frage">Kein Barcode erkannt. Bitte näher ran und gerade halten.</p><div class="reihe"><button class="knopf" data-act="schnell-scan">📷 Noch einmal</button><button class="knopf hell" data-act="schnell-stop">Abbrechen</button></div></div>';
    var bek = schnell.id ? produkt(schnell.id) : null;
    var kat = bek ? bek.kat : (letzteKat || state.kategorien[0].id);
    h += '<form class="block schnell" id="schnell-form" autocomplete="off">';
    h += '<p class="code">Barcode ' + esc(schnell.ean) + '</p>';
    if (bek) h += '<p class="bekannt">Schon bekannt: ' + esc(bek.name) + '. Preis prüfen.</p>';
    h += '<div class="felder"><label class="feld" for="s-name">Name<input id="s-name" type="text" list="ohne-code" enterkeyhint="next" value="' + esc(bek ? bek.name : '') + '"></label>';
    h += '<label class="feld" for="s-preis">Preis in €<input id="s-preis" type="text" inputmode="decimal" enterkeyhint="done" placeholder="z. B. 1,29" value="' + (bek ? esc(String(bek.preis).replace('.', ',')) : '') + '"></label>';
    h += '<label class="feld" for="s-kat">Bereich<select id="s-kat">';
    state.kategorien.forEach(function (k) { h += '<option value="' + esc(k.id) + '"' + (k.id === kat ? ' selected' : '') + '>' + esc(k.name) + '</option>'; });
    h += '</select></label>';
    h += '<label class="feld" for="s-ampel">Ampel<select id="s-ampel">' + ampelOptionen(bek ? bek.ampel : '') + '</select></label></div>';
    h += '<datalist id="ohne-code">';
    state.produkte.forEach(function (p) { if (!p.ean) h += '<option value="' + esc(p.name) + '"></option>'; });
    h += '</datalist>';
    h += '<p class="hinweis-klein">Tipp: Wähl einen vorgeschlagenen Namen, dann bekommt das vorhandene Produkt den Barcode. Die Ampel richtet sich nach dem Nutri-Score vorne auf der Packung.</p>';
    h += '<button class="knopf gruen" type="submit">✅ Übernehmen und nächster Scan</button>';
    h += '<div class="reihe"><button class="knopf hell klein" type="button" data-act="schnell-pause">Übernehmen, dann Pause</button><button class="knopf hell klein" type="button" data-act="schnell-scan">Überspringen</button><button class="knopf hell klein" type="button" data-act="schnell-stop">Abbrechen</button></div>';
    return h + '</form>';
  }

  function schnellUebernehmen(weiter) {
    var name = document.getElementById('s-name').value.trim();
    var preis = parseFloat(String(document.getElementById('s-preis').value).replace(',', '.'));
    var kat = document.getElementById('s-kat').value;
    var ampel = document.getElementById('s-ampel').value;
    if (!name) { statusText = 'Bitte einen Namen eintragen.'; render(); var n = document.getElementById('s-name'); if (n) n.focus(); return; }
    if (!(preis >= 0)) { statusText = 'Bitte einen Preis eintragen, zum Beispiel 1,29.'; render(); var q = document.getElementById('s-preis'); if (q) q.focus(); return; }
    preis = Math.round(preis * 100) / 100;
    var p = schnell.id ? produkt(schnell.id) : null;
    if (!p) p = state.produkte.find(function (x) { return !x.ean && x.name.toLowerCase() === name.toLowerCase(); }) || null;
    if (p) { p.name = name; p.preis = preis; p.kat = kat; p.ean = schnell.ean; if (ampel || !p.ampel) p.ampel = ampel; }
    else { state.produkte.push({ id: 'p' + Date.now(), name: name, preis: preis, emoji: KAT_EMOJI[kat] || '🛒', kat: kat, ean: schnell.ean, ampel: ampel }); }
    schnellZaehler++; letzteKat = kat; ungespeichert = true; schnell = null;
    statusText = '✓ ' + name + ' für ' + euro(cent(preis)) + ' übernommen.';
    if (weiter) { render(); scanStarten('schnell'); } else render();
  }

  function formularHtml() {
    var p = bearbeite === 'neu' ? { name: '', preis: '', emoji: '🛒', kat: state.kategorien[0].id, ean: '' } : produkt(bearbeite);
    if (!p) return '';
    p = Object.assign({}, p, entwurf);
    var foto = entwurfFoto !== null ? entwurfFoto : (p.foto || '');
    var h = '<div class="block" style="border-color:var(--accent)"><h2>' + (bearbeite === 'neu' ? 'Neues Produkt' : esc(produkt(bearbeite).name) + ' ändern') + '</h2><div class="felder">';
    h += '<label class="feld" for="f-name">Name<input id="f-name" type="text" value="' + esc(p.name) + '"></label>';
    h += '<label class="feld" for="f-preis">Preis in €<input id="f-preis" type="number" min="0" step="0.01" inputmode="decimal" value="' + esc(p.preis) + '"></label>';
    h += '<label class="feld" for="f-ean">Barcode (Zahl unter dem Strichcode)<input id="f-ean" type="text" inputmode="numeric" value="' + esc(p.ean) + '"></label>';
    h += '<label class="feld" for="f-kat">Bereich<select id="f-kat">';
    state.kategorien.forEach(function (k) { h += '<option value="' + esc(k.id) + '"' + (k.id === p.kat ? ' selected' : '') + '>' + esc(k.name) + '</option>'; });
    h += '</select></label>';
    h += '<label class="feld" for="f-ampel">Ampel<select id="f-ampel">' + ampelOptionen(p.ampel) + '</select></label>';
    h += '<label class="feld" for="f-emoji">Bild-Zeichen (ohne Foto)<input id="f-emoji" type="text" value="' + esc(p.emoji) + '"></label>';
    h += '</div><div class="reihe"><button class="knopf hell" data-act="formular-scan">📷 Barcode scannen</button>';
    h += (foto ? '<img class="foto-vorschau" src="' + esc(foto) + '" alt="Foto">' : '') + '<button class="knopf hell" data-act="foto">🖼️ ' + (foto ? 'Neues Foto' : 'Foto machen') + '</button>';
    if (foto) h += '<button class="knopf hell" data-act="foto-weg">Foto entfernen</button>';
    h += '</div><div class="reihe"><button class="knopf" data-act="uebernehmen">Übernehmen</button>';
    if (bearbeite !== 'neu') h += '<button class="knopf rot" data-act="loeschen">Löschen</button>';
    h += '<button class="knopf hell" data-act="abbrechen">Abbrechen</button></div></div>';
    return h;
  }

  /* ---------- Aktionen ---------- */
  function inKorb(id) {
    var p = produkt(id); if (!p) return;
    if (cent(p.preis) > rest()) { ergebnis = { typ: 'zuteuer', id: id }; sprich('Dafür reicht dein Geld nicht mehr.'); render(); return; }
    korb[id] = (korb[id] || 0) + 1; speichereKorb(); ergebnis = null;
    if (rest() < billigst()) sprich('Im Korb. Dein Geld ist jetzt alle. Geh zur Kasse.');
    else if (rest() / (cent(state.budget) || 1) < 0.25) sprich('Im Korb. Du hast nur noch wenig Geld.');
    else sprich('Im Korb.');
    render();
  }
  function weg(id) {
    if (!korb[id]) return;
    korb[id]--; if (korb[id] <= 0) delete korb[id]; speichereKorb();
    var p = produkt(id); sprich((p ? p.name : '') + ' zurückgelegt.'); render();
  }
  function uebernehmen() {
    var name = document.getElementById('f-name').value.trim();
    var preis = parseFloat(String(document.getElementById('f-preis').value).replace(',', '.'));
    var ean = norm(document.getElementById('f-ean').value);
    if (!name) { statusText = 'Bitte einen Namen eintragen.'; render(); return; }
    if (!(preis >= 0)) { statusText = 'Bitte einen Preis eintragen, zum Beispiel 1.29.'; render(); return; }
    var doppelt = ean && state.produkte.find(function (p) { return p.ean && norm(p.ean) === ean && p.id !== bearbeite; });
    if (doppelt) { statusText = 'Diesen Barcode hat schon „' + doppelt.name + '“.'; render(); return; }
    var daten = { name: name, preis: Math.round(preis * 100) / 100, ean: ean, kat: document.getElementById('f-kat').value, ampel: document.getElementById('f-ampel').value, emoji: document.getElementById('f-emoji').value.trim() || '🛒' };
    if (bearbeite === 'neu') { var p = Object.assign({ id: 'p' + Date.now() }, daten); if (entwurfFoto) p.foto = entwurfFoto; state.produkte.push(p); }
    else { var q = produkt(bearbeite); Object.assign(q, daten); if (entwurfFoto !== null) { if (entwurfFoto) q.foto = entwurfFoto; else delete q.foto; } }
    bearbeite = null; entwurf = {}; entwurfFoto = null; ungespeichert = true; statusText = name + ' übernommen. Zum Schluss auf Speichern tippen.'; render();
  }
  function fotoLaden(datei) {
    bildZuCanvas(datei, 260).then(function (c) { entwurfFoto = c.toDataURL('image/jpeg', 0.75); render(); })
      .catch(function () { statusText = 'Das Foto konnte nicht geladen werden.'; render(); });
  }

  function seiteBauen() {
    var reset = ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
    var json = JSON.stringify(state).replace(/</g, '\\u003c');
    var css = document.getElementById('app-style').textContent;
    var js = document.getElementById('app-script').textContent;
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>' +
      '<title>Mein Einkaufsgeld</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n' +
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">\n' +
      '<style id="app-style">' + css + '</style>\n\n<div id="app"></div>\n' +
      '<input id="scan-input" type="file" accept="image/*" capture="environment" hidden>\n<input id="foto-input" type="file" accept="image/*" capture="environment" hidden>\n\n' +
      '<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"><\/script>\n\n' +
      '<script type="application/json" id="daten">' + json + '<\/script>\n\n' +
      '<script id="app-script">' + js + '<\/script>\n</body></html>';
  }
  function speichern() {
    statusText = 'Speichere …'; render();
    var fertig = function (t) { statusText = t; render(); };
    if (!window.claude || !window.claude.use) { fertig('Speichern geht hier nicht. Bitte die App über claude.ai öffnen.'); return; }
    window.claude.use('artifact').then(function (artifact) {
      if (!artifact) { fertig('Speichern geht hier nicht. Du brauchst Bearbeitungsrechte für diese App.'); return; }
      return artifact.publish(seiteBauen()).then(function () { ungespeichert = false; loescheEntwurf(); fertig('Gespeichert. Die App lädt neu.'); });
    }).catch(function (e) {
      var code = e && e.code;
      if (code === 'not_granted' || code === 'not_writer') fertig('Speichern geht nur mit Bearbeitungsrechten.');
      else if (code === 'conflict') fertig('Jemand anderes hat gleichzeitig gespeichert. Bitte die Änderung noch einmal machen.');
      else fertig('Speichern hat nicht geklappt. Bitte noch einmal versuchen.');
    });
  }

  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el) return;
    var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
    if (['bearbeiten', 'neu-produkt', 'abbrechen', 'fertig'].indexOf(act) >= 0) { entwurf = {}; entwurfFoto = null; }
    switch (act) {
      case 'scannen': scanStarten('kunde'); return;
      case 'betreuer-scan': scanStarten('betreuer'); return;
      case 'schnell-scan': schnell = null; bearbeite = null; scanStarten('schnell'); return;
      case 'schnell-pause': schnellUebernehmen(false); return;
      case 'schnell-stop': schnell = null; break;
      case 'entwurf-holen': state = gesichert; gesichert = null; ungespeichert = true; statusText = 'Änderungen wiederhergestellt. Zum Schluss auf Speichern tippen.'; break;
      case 'entwurf-weg': loescheEntwurf(); break;
      case 'formular-scan': scanStarten('formular'); return;
      case 'foto': fotoInput.value = ''; fotoInput.click(); return;
      case 'in-korb': inKorb(id); return;
      case 'weg': weg(id); return;
      case 'ergebnis-weg': ergebnis = null; break;
      case 'neu-frage': frageNeu = true; break;
      case 'neu-nein': frageNeu = false; break;
      case 'neu-ja': korb = {}; speichereKorb(); frageNeu = false; ergebnis = null; sprich('Neue Woche. Du hast wieder dein ganzes Geld.'); break;
      case 'betreuer-frage': frageBetreuer = true; break;
      case 'betreuer-nein': frageBetreuer = false; break;
      case 'betreuer-ja': betreuer = true; frageBetreuer = false; statusText = ''; window.scrollTo(0, 0); break;
      case 'fertig': betreuer = false; bearbeite = null; schnell = null; statusText = ''; break;
      case 'bearbeiten': bearbeite = id; statusText = ''; window.scrollTo(0, 0); break;
      case 'neu-produkt': bearbeite = 'neu'; statusText = ''; break;
      case 'abbrechen': bearbeite = null; break;
      case 'foto-weg': entwurfFoto = ''; break;
      case 'uebernehmen': uebernehmen(); return;
      case 'loeschen': state.produkte = state.produkte.filter(function (p) { return p.id !== bearbeite; }); delete korb[bearbeite]; speichereKorb(); bearbeite = null; ungespeichert = true; statusText = 'Produkt gelöscht. Zum Schluss auf Speichern tippen.'; break;
      case 'speichern': speichern(); return;
    }
    render();
  });
  app.addEventListener('submit', function (e) {
    if (e.target.id === 'schnell-form') { e.preventDefault(); schnellUebernehmen(true); }
  });
  app.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 's-name') { e.preventDefault(); var q = document.getElementById('s-preis'); if (q) q.focus(); }
  });
  app.addEventListener('input', function (e) {
    if (e.target.id === 'f-suche') {
      suche = e.target.value; var pos = e.target.selectionStart; render();
      var s = document.getElementById('f-suche'); if (s) { s.focus(); try { s.setSelectionRange(pos, pos); } catch (x) {} }
      return;
    }
    var m = { 'f-name': 'name', 'f-preis': 'preis', 'f-kat': 'kat', 'f-emoji': 'emoji', 'f-ean': 'ean', 'f-ampel': 'ampel' }[e.target.id];
    if (m) entwurf[m] = e.target.value;
  });
  app.addEventListener('change', function (e) {
    if (e.target.id === 'f-budget') {
      var v = parseFloat(String(e.target.value).replace(',', '.'));
      if (v > 0) { state.budget = Math.round(v * 100) / 100; ungespeichert = true; statusText = 'Budget geändert. Zum Schluss auf Speichern tippen.'; render(); }
    }
  });
  /* Name schon beim Darüberfahren (Maus/Stift) oder beim Ansteuern mit der Tastatur vorlesen */
  var zuletztGesprochen = null;
  function vorlesenBei(el) {
    var z = el && el.closest && el.closest('[data-sprich]');
    if (!z) { zuletztGesprochen = null; return; }
    var t = z.getAttribute('data-sprich');
    if (t && t !== zuletztGesprochen) { zuletztGesprochen = t; sprich(t); }
  }
  app.addEventListener('pointerover', function (e) { if (e.pointerType === 'mouse' || e.pointerType === 'pen') vorlesenBei(e.target); });
  app.addEventListener('pointerleave', function () { zuletztGesprochen = null; });
  app.addEventListener('focusin', function (e) { vorlesenBei(e.target); });

  scanInput.addEventListener('change', function () { if (scanInput.files && scanInput.files[0]) scanVerarbeiten(scanInput.files[0]); });
  fotoInput.addEventListener('change', function () { if (fotoInput.files && fotoInput.files[0]) fotoLaden(fotoInput.files[0]); });

  render();
})();
</script>
